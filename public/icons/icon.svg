<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="60%" stop-color="#05070D" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7DF9FF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>
    <linearGradient id="signalRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E56" />
      <stop offset="100%" stop-color="#FF5376" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern Accent -->
  <g opacity="0.08" stroke="#00E5FF" stroke-width="1.5">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Outer Hexagonal Frame -->
  <polygon points="256,52 428,150 428,362 256,460 84,362 84,150" 
           fill="none" stroke="url(#cyberGrad)" stroke-width="6" opacity="0.85" filter="url(#softGlow)" />
  
  <!-- Inner Circuit Traces & Nodes -->
  <circle cx="256" cy="52" r="5" fill="#00E5FF" />
  <circle cx="428" cy="150" r="5" fill="#7DF9FF" />
  <circle cx="428" cy="362" r="5" fill="#A855F7" />
  <circle cx="256" cy="460" r="5" fill="#00E5FF" />
  <circle cx="84" cy="362" r="5" fill="#A855F7" />
  <circle cx="84" cy="150" r="5" fill="#00FFA3" />

  <!-- Central Trek Compass / Cyber Shield Geometry -->
  <g transform="translate(256,236)" filter="url(#glow)">
    <!-- Circuit Crosshair Ring -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.4" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="76" fill="rgba(0, 229, 255, 0.05)" stroke="url(#cyberGrad)" stroke-width="3" />

    <!-- Stylized Monogram "TT" -->
    <path d="M-60,-48 L-10,-48 L-10,-32 L-27,-32 L-27,48 L-43,48 L-43,-32 L-60,-32 Z" fill="url(#neonCyan)" />
    <path d="M10,-48 L60,-48 L60,-32 L43,-32 L43,48 L27,48 L27,-32 L10,-32 Z" fill="url(#cyberGrad)" />

    <!-- Core Nexus Diamond Indicator -->
    <polygon points="0,-18 12,0 0,18 -12,0" fill="url(#signalRed)" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Title & Branding Banner -->
  <text x="256" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="4">
    TECH TREK
  </text>
  
  <text x="256" y="412" text-anchor="middle" font-family="monospace" font-weight="700" font-size="14" fill="#00E5FF" letter-spacing="3" opacity="0.95">
    IEI × IETE · CHITKARA
  </text>

  <!-- Status Ping Node -->
  <circle cx="256" cy="116" r="4" fill="#00FFA3" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>